version: 2

models:
  - name: stg_customer_360
    description: >
      Staging view of the consolidated Customer 360 Gold dataset,
      containing one record per customer.
    columns:
      - name: customer_id
        description: Unique identifier for each customer.
        data_tests:
          - not_null
          - unique

      - name: customer_email
        description: Customer email address.
        data_tests:
          - not_null

      - name: total_orders
        description: Total number of orders placed by the customer.
        data_tests:
          - not_null

      - name: total_revenue
        description: Total revenue associated with the customer.
        data_tests:
          - not_null

      - name: average_order_value
        description: Average monetary value of the customer's orders.

  - name: stg_sales_summary
    description: >
      Daily sales and successful-payment performance metrics.
    columns:
      - name: sales_date
        description: Date represented by the sales summary row.
        data_tests:
          - not_null
          - unique

      - name: total_orders
        description: Total number of orders for the date.
        data_tests:
          - not_null

      - name: unique_customers
        description: Number of unique customers ordering on the date.
        data_tests:
          - not_null

      - name: gross_order_value
        description: Total gross value of orders.
        data_tests:
          - not_null

      - name: successful_payment_amount
        description: Total value of successful payments.

  - name: stg_product_performance
    description: >
      Product-level order, quantity, revenue and ranking metrics.
    columns:
      - name: product_id
        description: Unique identifier for each product.
        data_tests:
          - not_null
          - unique

      - name: units_sold
        description: Total number of units sold.
        data_tests:
          - not_null

      - name: total_orders
        description: Total orders containing the product.
        data_tests:
          - not_null

      - name: product_revenue
        description: Total revenue generated by the product.
        data_tests:
          - not_null

      - name: revenue_rank
        description: Product ranking based on revenue.

  - name: stg_marketing_summary
    description: >
      Marketing campaign and channel performance metrics.
    columns:
      - name: campaign_id
        description: Identifier for the marketing campaign.
        data_tests:
          - not_null

      - name: total_events
        description: Number of recorded marketing events.
        data_tests:
          - not_null

  - name: stg_support_summary
    description: >
      Support-ticket performance grouped by priority and category.
    columns:
      - name: support_group
        description: Unique support priority-and-category grouping.
        data_tests:
          - not_null
          - unique

      - name: total_tickets
        description: Total number of tickets in the group.
        data_tests:
          - not_null

      - name: resolved_tickets
        description: Number of resolved tickets.
        data_tests:
          - not_null

      - name: resolution_rate
        description: Percentage of tickets resolved.

      - name: average_satisfaction
        description: Average satisfaction score for the group.

  - name: stg_web_engagement_summary
    description: >
      Daily website activity and conversion-funnel metrics.
    columns:
      - name: engagement_date
        description: Date represented by the engagement summary.
        data_tests:
          - not_null
          - unique

      - name: total_events
        description: Total web events recorded for the date.
        data_tests:
          - not_null

      - name: unique_sessions
        description: Number of unique website sessions.
        data_tests:
          - not_null

      - name: unique_visitors
        description: Number of unique website visitors.
        data_tests:
          - not_null

      - name: session_conversion_rate
        description: Percentage of sessions that produced a conversion.